profile:
  ja:
    summary: デジタル・ヒューマニティーズの手法を用いながら、ローマ帝政期エジプトの経済を研究しています。
    expertise:
    - 古代ローマ史
    - 古代エジプト史
    - 経済史
    - デジタル・ヒューマニティーズ
    current_projects:
    - 穀物価格に基づくローマ帝政期エジプトの経済の評価：古代の物価データから、当時の経済構造や変動を評価・解明する。
    - パピルスからの機械的なデータ抽出：パピルスから効率的に情報を抽出し、計量的な歴史分析を行うための基盤を構築する。
  en:
    summary: I study the economic history of Roman Egypt by employing computational methods from the Digital Humanities.
    expertise:
    - Ancient Roman History
    - Ancient Egyptian History
    - Economic History
    - Digital Humanities
    current_projects:
    - Evaluating the economy of Roman Egypt based on grain prices by analyzing ancient commodity data to understand economic
      structures and fluctuations.
    - Developing computational approaches for semi-automatic data extraction from papyri and quantitative analysis of ancient
      documents.
